<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-dark">
    <div class="container p-3 mt-3">
        <div class="container text-center bg-light">
            <form class="p-3">
                <label class="fw-bold fs-3">Username:</label><br>
                <input type="text" id="un" class="fw-bold text-center rounded-2" placeholder="Username"><br>
                <label class="fw-bold fs-3">Password:</label><br>
                <input type="password" id="ps" placeholder="Password" class="fw-bold text-center rounded-2"><br><br>
                <input type="button" py-click="acc_make" class="text-center p-2 btn fw-bold btn-primary border border-2 border-dark" value="Create" py-click="acc_make">
            </form>
        </div>
        <div id="out" class="fw-bold fs-4 p-3 text-light text-center bg-secondary rounded-bottom-3"></div>
    </div>
</body>
<script type="py" src="main.py"></script>
</html>
